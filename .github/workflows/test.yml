name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run forecasting MCP tests
        run: python3 scripts/test_forecasting_mcp.py

      - name: Run plugin integrity tests
        run: python3 scripts/test_plugin_integrity.py
